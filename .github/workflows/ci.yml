name: QR ORDERING SYSTEM

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # BACKEND LARAVEL
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      APP_KEY: "base64:pKXYTal1iAq/9gXvj3yNpq27lqwZrtcYwI/Vq7F9S14="

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel tests
        run: composer test

  # FRONTEND REACT
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build React
        run: npm run build
